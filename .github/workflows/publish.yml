name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out main with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Enable the pinned pnpm version
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select and synchronize the release version
        id: release
        run: |
          release_version="$(pnpm --silent run release:prepare)"
          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate source, generated artifacts, and package behavior
        run: |
          pnpm check
          pnpm test
          git diff --check

      - name: Commit and tag the release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${RELEASE_VERSION}"
          fi
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n 1 "${tag}")" = "$(git rev-parse HEAD)"
          else
            git tag -a "${tag}" -m "${tag}"
          fi
          git push origin HEAD:main
          git push origin "${tag}"

      - name: Publish the public package
        run: npm publish --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --verify-tag \
            --generate-notes \
            --title "v${RELEASE_VERSION}"
